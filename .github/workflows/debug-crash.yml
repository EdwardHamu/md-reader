name: Debug #33 macOS double-click crash

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Keep symbols in the binary so the crash report shows function names.
      - name: Build Tauri app (unstripped, .app only)
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles app

      - name: Reproduce odoc double-click crash
        run: |
          APP="$GITHUB_WORKSPACE/src-tauri/target/release/bundle/macos/MD Reader.app"
          BIN="$APP/Contents/MacOS/md-reader"
          printf '# hello\n\nworld\n' > /tmp/repro.md
          export RUST_BACKTRACE=full
          echo "== test A: launch binary directly, deliver odoc via AppleScript =="
          rm -f /tmp/md-reader-panic.log /tmp/stderr.log
          "$BIN" > /tmp/stderr.log 2>&1 &
          sleep 8
          if ! pgrep -x md-reader > /dev/null; then
            echo "== CRASHED AT LAUNCH (no odoc delivered) =="
            tail -40 /tmp/stderr.log; cat /tmp/md-reader-panic.log 2>/dev/null
            exit 0
          fi
          osascript -e 'tell application "MD Reader" to open POSIX file "/tmp/repro.md"' || echo "osascript failed"
          sleep 8
          if pgrep -x md-reader > /dev/null; then
            echo "== ALIVE after odoc =="
          else
            echo "== CRASHED after odoc =="
          fi
          echo "== stderr =="
          tail -60 /tmp/stderr.log
          echo "== panic file =="
          cat /tmp/md-reader-panic.log 2>/dev/null || echo "(no panic file)"
          pkill -x md-reader 2>/dev/null; sleep 2
          echo "== test B: Launch Services launch (reporter flow) =="
          rm -f /tmp/md-reader-panic.log
          open -a "$APP" /tmp/repro.md
          sleep 15
          if pgrep -x md-reader > /dev/null; then
            echo "== ALIVE =="
            pkill -x md-reader
          else
            echo "== CRASHED =="
          fi
          echo "== panic file =="
          cat /tmp/md-reader-panic.log 2>/dev/null || echo "(no panic file)"
          echo "== diagnostic reports =="
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          retention-days: 7
          if-no-files-found: warn
          path: ~/Library/Logs/DiagnosticReports/*.ips
